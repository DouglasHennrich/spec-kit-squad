name: Test

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-manifest:
    name: Validate Manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Check required extension fields
        run: |
          errors=0
          check() {
            local field=$1 value=$2
            if [ -z "$value" ] || [ "$value" = "null" ]; then
              echo "❌ Missing required field: $field"
              errors=$((errors + 1))
            else
              echo "✅ $field: $value"
            fi
          }
          check "extension.id"          "$(yq '.extension.id'          extension.yml)"
          check "extension.name"        "$(yq '.extension.name'        extension.yml)"
          check "extension.version"     "$(yq '.extension.version'     extension.yml)"
          check "extension.author"      "$(yq '.extension.author'      extension.yml)"
          check "extension.repository"  "$(yq '.extension.repository'  extension.yml)"
          check "extension.license"     "$(yq '.extension.license'     extension.yml)"
          check "schema_version"        "$(yq '.schema_version'        extension.yml)"
          exit $errors

      - name: Check command files exist on disk
        run: |
          errors=0
          while IFS= read -r file; do
            if [ -f "$file" ]; then
              echo "✅ $file"
            else
              echo "❌ Missing command file: $file"
              errors=$((errors + 1))
            fi
          done < <(yq '.provides.commands[].file' extension.yml)
          exit $errors

      - name: Check config template files exist on disk
        run: |
          errors=0
          while IFS= read -r template; do
            if [ -f "$template" ]; then
              echo "✅ $template"
            else
              echo "❌ Missing template file: $template"
              errors=$((errors + 1))
            fi
          done < <(yq '.provides.config[].template' extension.yml)
          exit $errors

      - name: Check command file frontmatter
        run: |
          errors=0
          while IFS= read -r file; do
            if ! head -5 "$file" | grep -q "^description:"; then
              echo "❌ Missing frontmatter description in: $file"
              errors=$((errors + 1))
            else
              echo "✅ frontmatter ok: $file"
            fi
          done < <(yq '.provides.commands[].file' extension.yml)
          exit $errors
