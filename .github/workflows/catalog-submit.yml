name: Submit to Spec Kit Catalog

on:
  release:
    types: [published]

jobs:
  submit-catalog:
    name: Update docs and file catalog issue
    runs-on: ubuntu-latest

    steps:
      - name: Parse version from tag
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          echo "date=$(date -u +%Y-%m-%dT00:00:00Z)" >> $GITHUB_OUTPUT

      - name: Checkout spec-kit-squad
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Install Python dependencies
        run: pip install pyyaml jinja2

      - name: File catalog submission issue
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          DATE: ${{ steps.version.outputs.date }}
          DOWNLOAD_URL: https://github.com/jwill824/spec-kit-squad/archive/refs/tags/${{ steps.version.outputs.tag }}.zip
        run: |
          python3 .github/scripts/build-catalog-submission.py \
            .github/templates/catalog-submission.md.j2 \
            /tmp/catalog-submission-final.md

          issue_url=$(gh issue create \
            --repo github/spec-kit \
            --title "Extension Submission: Squad Bridge v${VERSION}" \
            --body-file /tmp/catalog-submission-final.md \
            --label "extension-submission" \
            --label "enhancement" \
            --label "needs-triage")
          echo "url=$issue_url" >> $GITHUB_OUTPUT

      - name: Write job summary
        run: |
          echo "## 📦 Catalog issue filed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** v${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Issue:** ${{ steps.issue.outputs.url }}" >> $GITHUB_STEP_SUMMARY
