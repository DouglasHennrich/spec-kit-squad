name: Sync Catalog

on:
  release:
    types: [published]

jobs:
  sync-catalog:
    name: Open spec-kit catalog PR
    runs-on: ubuntu-latest

    steps:
      - name: Parse version from tag
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          echo "date=$(date -u +%Y-%m-%dT00:00:00Z)" >> $GITHUB_OUTPUT

      - name: Checkout spec-kit fork
        uses: actions/checkout@v6
        with:
          repository: jwill824/spec-kit
          token: ${{ secrets.GH_TOKEN }}

      - name: Sync fork branch from upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/github/spec-kit.git
          git fetch upstream
          git checkout -b feat/bump-squad-to-v${{ steps.version.outputs.version }} upstream/main

      - name: Update catalog entry
        run: |
          python3 - << 'PYEOF'
          import re, os, json

          version     = os.environ['VERSION']
          today       = os.environ['TODAY']
          tag         = os.environ['TAG']
          download_url = (
              f"https://github.com/jwill824/spec-kit-squad"
              f"/archive/refs/tags/{tag}.zip"
          )

          with open('extensions/catalog.community.json', 'r') as f:
              content = f.read()

          squad_marker = '"squad": {'

          if squad_marker in content:
              # Update existing entry in place — find the block boundaries
              start = content.index(squad_marker)
              brace_count = 0
              end = start
              for i, c in enumerate(content[start:], start):
                  if c == '{':
                      brace_count += 1
                  elif c == '}':
                      brace_count -= 1
                      if brace_count == 0:
                          end = i + 1
                          break

              block = content[start:end]
              block = re.sub(r'"version":\s*"[^"]*"',     f'"version": "{version}"',     block, count=1)
              block = re.sub(r'"download_url":\s*"[^"]*"', f'"download_url": "{download_url}"', block, count=1)
              block = re.sub(r'"updated_at":\s*"[^"]*"',   f'"updated_at": "{today}"',    block, count=1)
              content = content[:start] + block + content[end:]
          else:
              # Entry not yet in catalog — insert it before "staff-review"
              squad_block = f'''\
              "squad": {{
                "name": "Squad Bridge",
                "id": "squad",
                "description": "Bootstrap and synchronize a Squad agent team from your Speckit spec and tasks.",
                "author": "jwill824",
                "version": "{version}",
                "download_url": "{download_url}",
                "repository": "https://github.com/jwill824/spec-kit-squad",
                "homepage": "https://github.com/jwill824/spec-kit-squad",
                "documentation": "https://github.com/jwill824/spec-kit-squad/blob/main/README.md",
                "changelog": "https://github.com/jwill824/spec-kit-squad/blob/main/docs/CHANGELOG.md",
                "license": "MIT",
                "requires": {{
                  "speckit_version": ">=0.1.0"
                }},
                "provides": {{
                  "commands": 4,
                  "hooks": 2
                }},
                "tags": [
                  "multi-agent",
                  "agents",
                  "orchestration",
                  "process",
                  "integration"
                ],
                "verified": false,
                "downloads": 0,
                "stars": 0,
                "created_at": "{today}",
                "updated_at": "{today}"
              }},
          '''
              # Dedent the heredoc (strip leading spaces from each line)
              import textwrap
              squad_block = textwrap.dedent(squad_block)
              insertion = '    "staff-review":'
              idx = content.index(insertion)
              content = content[:idx] + squad_block + content[idx:]

          with open('extensions/catalog.community.json', 'w') as f:
              f.write(content)

          data = json.load(open('extensions/catalog.community.json'))
          assert data['extensions']['squad']['version'] == version, 'version mismatch'
          print(f"catalog updated: squad v{version}")
          PYEOF
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          TODAY: ${{ steps.version.outputs.date }}

      - name: Commit and push
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/jwill824/spec-kit.git
          git add extensions/catalog.community.json
          git commit -m "chore: bump squad to v${{ steps.version.outputs.version }}"
          git push origin feat/bump-squad-to-v${{ steps.version.outputs.version }}

      - name: Open PR
        id: pr
        run: |
          envsubst < .github/pull_request_templates/catalog-update.md > /tmp/pr-body.md
          pr_url=$(gh pr create \
            --repo github/spec-kit \
            --head jwill824:feat/bump-squad-to-v${{ steps.version.outputs.version }} \
            --base main \
            --title "chore: bump squad extension to v${{ steps.version.outputs.version }}" \
            --body-file /tmp/pr-body.md)
          echo "url=$pr_url" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}

      - name: Write job summary
        run: |
          echo "## 📦 Catalog PR opened" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** v${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**PR:** ${{ steps.pr.outputs.url }}" >> $GITHUB_STEP_SUMMARY
