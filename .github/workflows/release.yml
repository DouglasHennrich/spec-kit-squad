name: Version Bump

on:
  push:
    branches:
      - main
    paths:
      - 'commands/**'
      - 'extension.yml'
      - 'squad-config.template.yml'

jobs:
  version-bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version and push tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main
          tag_prefix: v

      - name: Update version in extension.yml
        if: steps.tag.outputs.new_version != ''
        run: |
          VERSION="${{ steps.tag.outputs.new_version }}"
          sed -i "s/^  version: \".*\"/  version: \"${VERSION}\"/" extension.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add extension.yml
          git diff --staged --quiet || git commit -m "chore: bump version to ${VERSION} [skip ci]"
          git push

      - name: Create GitHub Release
        if: steps.tag.outputs.new_version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}
          generate_release_notes: true
